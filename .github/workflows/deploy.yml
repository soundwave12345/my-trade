name: Deploy Application

on:
  push:
    branches:
      - master  # Trigger quando fai push su main
  pull_request:
    branches:
      - master  # Trigger quando apri una PR verso main
    types:
      - closed # Esegue solo quando la PR viene chiusa (merge completata)
jobs:
  deploy:
    runs-on: self-hosted  # Indica che deve usare il runner del server

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Build immagine Docker
        run: docker build -t mytrade:latest .

      - name: Stop container esistente
        run: docker stop mytrade_container || true

      - name: Rimuovi container vecchio
        run: docker rm mytrade_container || true

      - name: Avvia nuovo container
        run: docker run -d -p 5002:5002 -v /home/ha/mytradedb/data:/app/data --name mytrade_container mytrade:latest

      - name: Controlla i log iniziali
        run: |
          sleep 10  # aspetta che il servizio parta
          docker logs mytrade_container
          
          # Se il container è crashato, esci con errore
          if [ $(docker inspect -f '{{.State.ExitCode}}' mytrade_container) != 0 ]; then
            echo "❌ Il container è crashato all'avvio!"
            exit 1
          fi

